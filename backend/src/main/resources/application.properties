spring.application.name=flipfinder
spring.profiles.default=local

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

server.port=${SERVER_PORT:8081}

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html

flipfinder.ingest.base-url=https://prices.runescape.wiki/api/v2/osrs
flipfinder.ingest.user-agent=OSRS-Flip-Finder/0.1 (+https://github.com/griffinseibold/OSRS-Flip-Finder)
flipfinder.ingest.poll-delay-ms=300000

# Accepts account data from the RuneLite plugin. The homelab profile turns it on.
flipfinder.runelite.enabled=false

# Keeps trading history to compare the latest trading with. Both profiles turn
# it on: the homelab keeps weeks on disk, the standalone version two days in memory.
flipfinder.history.enabled=false
flipfinder.history.five-minute-days=7
flipfinder.history.hourly-days=30
flipfinder.history.five-minute-backfill-hours=24

# Answers questions with a language model. The homelab profile turns it on and
# names the server in flipfinder.llm.base-url; both are needed.
flipfinder.llm.enabled=false
# Where the server reports whether it is ready. Empty checks /health at the base
# URL's root, without its trailing /v1, which is where llama.cpp serves it.
flipfinder.llm.health-url=
# The homelab starts its language model on demand. A question asked while it
# loads waits this long for it, checking every startup-poll, before giving up.
# Keep the wait well under the request timeout below, so the answer still has
# time to stream once the model is up.
flipfinder.llm.startup-wait=90s
flipfinder.llm.startup-poll=2s

# Chat answers stream for as long as the language model takes.
spring.mvc.async.request-timeout=3m
