# SQLite uses one ReadWriteOnce volume and supports a single application writer.
# Keep this at one replica when persistence is enabled.
replicaCount: 1

image:
  repository: ghcr.io/griffinseibold/osrs-flip-finder
  tag: "0.4.0"
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  size: 1Gi
  # Empty uses the cluster's default StorageClass (standard in the homelab).
  storageClassName: ""
  mountPath: /data

# The chat, which answers with the homelab's language model. The homelab only
# runs its model while an application asks for it, so while this is on the
# Deployment carries the homelab.local/llm: requested label: the homelab starts
# the model while Flip Finder runs and stops it a few minutes after Flip Finder
# stops. Set enabled to false to turn the chat off and stop asking for the GPU.
# Only the homelab profile (persistence.enabled) has a chat, so the in-memory
# local profile never asks for the model.
llm:
  enabled: true

# Labels applied to the release namespace so the homelab Gateway can admit the
# HTTPRoute. Override these values when deploying to another platform.
namespace:
  create: true
  labels:
    gateway.homelab/access: public
    # Also admits the route to the homelab's home-network HTTPS listener.
    gateway.homelab/lan: "true"

httpRoute:
  enabled: true
  # With the defaults, the app is served as flipfinder.localhost on the
  # homelab host and as flipfinder.lab.internal on the home network. Set
  # hostnames to replace the generated names.
  domains:
    - localhost
    - lab.internal
  hostnames: []
  parentRefs:
    - name: homelab
      namespace: gateway-system
      sectionName: http
    - name: homelab
      namespace: gateway-system
      sectionName: lan

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi
